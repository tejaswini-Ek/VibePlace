kind = "web"
previewPath = "/"
title = "Mood Place Finder"
description = "A mood-aware place discovery app that helps people find nearby restaurants, cafes, parks, and other useful places using OpenStreetMap data, filters, maps, and personalized recommendations."
version = "1.0.0"
id = "artifacts/mood-place-finder"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20498

[services.development]
run = "pnpm --filter @workspace/mood-place-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mood-place-finder", "run", "build" ]
serve = "static"
publicDir = "artifacts/mood-place-finder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20498"
BASE_PATH = "/"
